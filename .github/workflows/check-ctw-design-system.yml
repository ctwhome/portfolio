name: Check CTW Studio

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'DESIGN.md'
      - 'README.md'
      - 'ctw.studio/**'
      - '.github/workflows/check-ctw-design-system.yml'
  push:
    paths:
      - 'AGENTS.md'
      - 'DESIGN.md'
      - 'README.md'
      - 'ctw.studio/**'
      - '.github/workflows/check-ctw-design-system.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          valid_commit() {
            [ -n "$1" ] &&
              ! printf '%s' "$1" | grep -Eq '^0+$' &&
              git cat-file -e "$1^{commit}" 2>/dev/null
          }

          base_sha=""
          candidate_base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            candidate_base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            candidate_base="$PUSH_BEFORE_SHA"
          fi

          if printf '%s' "$candidate_base" | grep -Eq '^[0-9a-f]{40}$' &&
            ! printf '%s' "$candidate_base" | grep -Eq '^0+$'; then
            if ! valid_commit "$candidate_base"; then
              git fetch --no-tags origin "$candidate_base" || true
            fi
            if valid_commit "$candidate_base"; then
              base_sha="$candidate_base"
            fi
          fi

          if [ -z "$base_sha" ]; then
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "Unable to resolve repository default branch."
              exit 1
            fi
            if [ "$EVENT_NAME" = "push" ] && [ "$PUSH_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              echo "Unable to resolve the previous default-branch commit; refusing a partial comparison."
              exit 1
            fi
            git fetch --no-tags origin \
              "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            if ! base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"; then
              echo "Unable to find merge base with origin/$DEFAULT_BRANCH."
              exit 1
            fi
          fi

          if ! valid_commit "$base_sha"; then
            echo "Unable to resolve a valid CTW Studio comparison base."
            exit 1
          fi

          echo "CTW_STUDIO_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - name: Guard generated NLeSC export
        run: |
          if ! git diff --quiet "$CTW_STUDIO_BASE_SHA" HEAD -- ctw.studio/nlesc; then
            echo "ctw.studio/nlesc must not change in CTW Studio app work."
            git diff --stat "$CTW_STUDIO_BASE_SHA" HEAD -- ctw.studio/nlesc
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install CTW Studio dependencies
        working-directory: ctw.studio
        run: bun install --frozen-lockfile

      - name: Verify DESIGN.md and generated tokens
        run: |
          npx --yes @google/design.md@0.3.0 lint DESIGN.md
          npx --yes @google/design.md@0.3.0 export --format dtcg DESIGN.md > /tmp/ctw-design-tokens.json
          diff -u ctw.studio/design-system/tokens.json /tmp/ctw-design-tokens.json

      - name: Install Chromium
        working-directory: ctw.studio
        run: bunx playwright install --with-deps chromium

      - name: Check and build
        working-directory: ctw.studio
        run: |
          bun run check
          bun run build

      - name: Test Signals
        working-directory: ctw.studio
        run: bun run test:signals:built

      - name: Test design system
        working-directory: ctw.studio
        run: bun run test:design:built

      - name: Check runtime syntax
        working-directory: ctw.studio
        run: bun run test:syntax

      - name: Test built output
        working-directory: ctw.studio
        run: bun run test:dist:built

      - name: Test browser behavior
        working-directory: ctw.studio
        run: bun run test:e2e:built

      - name: Test visual behavior
        working-directory: ctw.studio
        run: bun run test:visual:built

      - name: Test Lighthouse budgets
        working-directory: ctw.studio
        run: bun run test:lighthouse:built

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctw-studio-playwright
          path: |
            ctw.studio/test-results/**
            ctw.studio/design-system/test-results/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctw-studio-lighthouse
          path: ctw.studio/lighthouse-results/**
          retention-days: 14
          if-no-files-found: ignore

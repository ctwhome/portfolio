name: Check CTW design system

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'DESIGN.md'
      - 'README.md'
      - 'ctw.studio/design-system/**'
      - '.github/workflows/check-ctw-design-system.yml'
  push:
    paths:
      - 'AGENTS.md'
      - 'DESIGN.md'
      - 'README.md'
      - 'ctw.studio/design-system/**'
      - '.github/workflows/check-ctw-design-system.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          valid_commit() {
            [ -n "$1" ] &&
              ! printf '%s' "$1" | grep -Eq '^0+$' &&
              git cat-file -e "$1^{commit}" 2>/dev/null
          }

          base_sha=""
          candidate_base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            candidate_base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            candidate_base="$PUSH_BEFORE_SHA"
          fi

          if printf '%s' "$candidate_base" | grep -Eq '^[0-9a-f]{40}$' &&
            ! printf '%s' "$candidate_base" | grep -Eq '^0+$'; then
            if ! valid_commit "$candidate_base"; then
              git fetch --no-tags origin "$candidate_base" || true
            fi
            if valid_commit "$candidate_base"; then
              base_sha="$candidate_base"
            fi
          fi

          if [ -z "$base_sha" ]; then
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "Unable to resolve repository default branch."
              exit 1
            fi
            if [ "$EVENT_NAME" = "push" ] && [ "$PUSH_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              echo "Unable to resolve the previous default-branch commit; refusing a partial comparison."
              exit 1
            fi
            git fetch --no-tags origin \
              "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            if ! base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"; then
              echo "Unable to find merge base with origin/$DEFAULT_BRANCH."
              exit 1
            fi
          fi

          if ! valid_commit "$base_sha"; then
            echo "Unable to resolve a valid design-system comparison base."
            exit 1
          fi

          echo "DESIGN_SYSTEM_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Lint DESIGN.md
        run: npx --yes @google/design.md@0.3.0 lint DESIGN.md

      - name: Verify generated DTCG tokens
        run: |
          npx --yes @google/design.md@0.3.0 export --format dtcg DESIGN.md > /tmp/ctw-design-tokens.json
          diff -u ctw.studio/design-system/tokens.json /tmp/ctw-design-tokens.json

      - name: Test design system
        run: node --test ctw.studio/design-system/tests/design-system.test.mjs

      - name: Install Chromium for visual audit
        run: npx --yes @playwright/test@1.62.0 install --with-deps chromium

      - name: Run design-system visual audit
        run: |
          npx --yes --package=@playwright/test@1.62.0 -- sh -c \
            'NODE_PATH="$(dirname "$(dirname "$(command -v playwright)")")" playwright test --config ctw.studio/design-system/tests/playwright.config.cjs'

      - name: Upload design-system visual audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctw-design-system-visual-audit
          path: ctw.studio/design-system/test-results/**
          retention-days: 14
          if-no-files-found: error

      - name: Test Signals
        working-directory: ctw.studio
        run: node --test signals/tests/*.test.mjs

      - name: Check static files
        run: |
          test -f DESIGN.md
          test -f ctw.studio/design-system/index.html
          test -f ctw.studio/design-system/tokens.css
          test -f ctw.studio/design-system/tokens.json
          test -f ctw.studio/design-system/components.css
          test -f ctw.studio/design-system/compat.css
          test -f ctw.studio/design-system/guide.css

      - name: Guard generated NLeSC export
        run: |
          if ! git diff --quiet "$DESIGN_SYSTEM_BASE_SHA" HEAD -- ctw.studio/nlesc; then
            echo "ctw.studio/nlesc must not change in design-system work."
            git diff --stat "$DESIGN_SYSTEM_BASE_SHA" HEAD -- ctw.studio/nlesc
            exit 1
          fi
